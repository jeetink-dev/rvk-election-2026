<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RVK Election Voting Booth</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{

--primary:#0d47a1;
--secondary:#1565c0;
--success:#2e7d32;
--light:#f4f7fc;
--white:#ffffff;
--shadow:0 10px 35px rgba(0,0,0,.08);

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

font-family:'Inter',sans-serif;

background:
linear-gradient(
135deg,
#edf3ff,
#f9fbff
);

padding:20px;

}

/* =======================
   PROGRESS BAR
======================= */

#progressBox{

position:sticky;
top:10px;

z-index:999;

background:white;

padding:18px;

border-radius:18px;

box-shadow:var(--shadow);

margin-bottom:25px;

}

#progressText{

font-weight:700;

font-size:16px;

color:var(--primary);

margin-bottom:12px;

}

.progressBar{

height:14px;

background:#e0e0e0;

border-radius:30px;

overflow:hidden;

}

#progressFill{

height:100%;

width:0%;

background:
linear-gradient(
90deg,
#43a047,
#66bb6a
);

transition:.4s;

}

/* =======================
   HEADER
======================= */

.header{

background:
linear-gradient(
135deg,
#002b7f,
#0d47a1
);

padding:30px;

border-radius:25px;

text-align:center;

color:white;

box-shadow:
0 15px 40px rgba(13,71,161,.25);

margin-bottom:30px;

position:relative;

overflow:hidden;

}

.header::before{

content:"";

position:absolute;

top:-100px;
left:-100px;

width:300px;
height:300px;

background:
rgba(255,255,255,.05);

border-radius:50%;

}

.header::after{

content:"";

position:absolute;

bottom:-120px;
right:-120px;

width:320px;
height:320px;

background:
rgba(255,255,255,.05);

border-radius:50%;

}

.header img{

width:110px;

height:110px;

object-fit:contain;

margin-bottom:15px;

background:white;

padding:8px;

border-radius:50%;

}

.header h1{

font-family:'Montserrat',sans-serif;

font-size:42px;

font-weight:800;

letter-spacing:1px;

margin-bottom:10px;

}

.header h2{

font-size:26px;

font-weight:600;

margin-bottom:10px;

}

.header p{

font-size:18px;

opacity:.95;

}

/* =======================
   LIVE STATUS
======================= */

.live-status{

display:flex;

justify-content:center;

align-items:center;

gap:10px;

margin-top:20px;

font-weight:600;

}

.live-dot{

width:12px;
height:12px;

background:#00e676;

border-radius:50%;

animation:pulse 1.5s infinite;

}

@keyframes pulse{

0%{
transform:scale(1);
opacity:1;
}

100%{
transform:scale(2);
opacity:0;
}

}

/* =======================
   MINISTRY CARD
======================= */

.ministry{

background:
rgba(255,255,255,.9);

backdrop-filter:blur(15px);

padding:25px;

border-radius:25px;

margin-bottom:25px;

box-shadow:var(--shadow);

border:1px solid rgba(255,255,255,.5);

transition:.3s;

}

.ministry:hover{

transform:translateY(-3px);

}

.ministry-title{

background:
linear-gradient(
135deg,
var(--primary),
var(--secondary)
);

color:white;

padding:16px;

border-radius:15px;

text-align:center;

font-size:24px;

font-weight:700;

font-family:'Montserrat',sans-serif;

margin-bottom:25px;

box-shadow:
0 8px 20px rgba(13,71,161,.25);

}

/* =======================
   CANDIDATES GRID
======================= */

.candidates{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:20px;

}

/* =======================
   CANDIDATE CARD
======================= */

.candidate{

background:white;

border:2px solid #e3eaf7;

border-radius:22px;

padding:22px;

text-align:center;

cursor:pointer;

transition:.35s;

position:relative;

overflow:hidden;

min-height:300px;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

}

.candidate::before{

content:"";

position:absolute;

top:0;
left:-100%;

width:100%;
height:100%;

background:
linear-gradient(
90deg,
transparent,
rgba(255,255,255,.5),
transparent
);

transition:.5s;

}

.candidate:hover::before{

left:100%;

}

.candidate:hover{

transform:translateY(-8px);

border-color:var(--secondary);

box-shadow:
0 20px 40px rgba(21,101,192,.18);

background:
linear-gradient(
135deg,
#ffffff,
#f2f8ff
);

}

/* =======================
   CANDIDATE LOGO
======================= */

.candidate-logo{

width:110px;

height:110px;

object-fit:contain;

margin-bottom:18px;

transition:.3s;

}

.candidate:hover .candidate-logo{

transform:scale(1.12);

}

/* =======================
   CANDIDATE NAME
======================= */

.candidate-name{

font-family:'Montserrat',sans-serif;

font-size:24px;

font-weight:800;

color:var(--primary);

margin-bottom:10px;

letter-spacing:.8px;

text-transform:uppercase;

}

/* =======================
   SYMBOL TEXT
======================= */

.symbol-label{

font-size:15px;

font-weight:600;

color:#666;

margin-bottom:15px;

}

/* =======================
   RADIO BUTTON
======================= */

.candidate input{

transform:scale(1.6);

cursor:pointer;

}

/* =======================
   SELECTED CARD
======================= */

.candidate.selected{

background:
linear-gradient(
135deg,
#1565c0,
#0d47a1
);

color:white;

border:2px solid #64b5f6;

transform:translateY(-5px);

box-shadow:
0 20px 45px rgba(13,71,161,.35);

}

.candidate.selected .candidate-name{

color:white;

}

.candidate.selected .symbol-label{

color:#e3f2fd;

}

/* =======================
   MISSING SECTION
======================= */

.missing{

border:3px solid #e53935;

animation:shake .4s linear 3;

}

@keyframes shake{

0%,100%{
transform:translateX(0);
}

25%{
transform:translateX(-8px);
}

75%{
transform:translateX(8px);
}

}

/* =======================
   SUBMIT BUTTON
======================= */

.submit-btn{

width:100%;

padding:22px;

font-size:22px;

font-weight:800;

font-family:'Montserrat',sans-serif;

background:
linear-gradient(
135deg,
#2e7d32,
#43a047
);

color:white;

border:none;

border-radius:18px;

cursor:pointer;

position:sticky;

bottom:10px;

box-shadow:
0 10px 25px rgba(46,125,50,.25);

transition:.3s;

}

.submit-btn:hover{

transform:translateY(-3px);

background:
linear-gradient(
135deg,
#1b5e20,
#2e7d32
);

}

.submit-btn:disabled{

opacity:.7;
cursor:not-allowed;

}

/* =======================
   SUCCESS MESSAGE
======================= */

.success{

background:#e8f5e9;

color:#2e7d32;

padding:20px;

border-radius:15px;

text-align:center;

font-size:24px;

font-weight:700;

margin-top:20px;

}

/* =======================
   LOADER
======================= */

.loader{

display:none;

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:
rgba(255,255,255,.85);

z-index:9999;

justify-content:center;

align-items:center;

flex-direction:column;

}

.spinner{

width:70px;
height:70px;

border:6px solid #ddd;

border-top:6px solid var(--primary);

border-radius:50%;

animation:spin 1s linear infinite;

margin-bottom:15px;

}

@keyframes spin{

100%{
transform:rotate(360deg);
}

}

/* =======================
   MOBILE
======================= */

@media(max-width:768px){

.header h1{
font-size:30px;
}

.header h2{
font-size:20px;
}

.ministry-title{
font-size:20px;
}

.candidate{
min-height:260px;
}

.candidate-name{
font-size:20px;
}

}

</style>

</head>

<body>

<div id="progressBox">

<div id="progressText">

0 / 14 Ministries Completed

</div>

<div class="progressBar">

<div id="progressFill"></div>

</div>

</div>

<div class="header">

<img src="Picture1.jpg" alt="School Logo">

<h1>RASHTROTTHANA VIDYA KENDRA</h1>

<h2>KALABURAGI</h2>

<p>Student Council Election 2026–27</p>

<div class="live-status">

<div class="live-dot"></div>

<span>Electronic Voting Booth Active</span>

</div>

</div>

<form id="votingForm">

<div id="ministriesContainer"></div>

<button
type="submit"
class="submit-btn">

🗳 SUBMIT MY VOTE

</button>

</form>

<div class="loader" id="loader">

<div class="spinner"></div>

<h3>Submitting Vote...</h3>

</div>

<iframe
name="hiddenFrame"
style="display:none;">
</iframe>
<script>

/* ==========================
   APPS SCRIPT WEB APP URL
========================== */

const WEBAPP_URL =
"https://script.google.com/macros/s/AKfycbyUP49bRuBO7Btfqq7UiiN3m9X4puuY5sULwsBwTMf0yzXS1WS-r8BPx-iFKh-IP4_4/exec";

/* ==========================
   CANDIDATE LOGOS
   Place matching images in:
   /logos/
========================== */

const candidateLogos = {

"AMARNATH":"logos/AMARNATH.png",
"AMBRISH":"logos/AMBRISH.png",

"SINCHANA":"logos/SINCHANA.png",
"ANAGHA":"logos/ANAGHA.png",
"ANVI":"logos/ANVI.png",

"KARTHIK":"logos/KARTHIK.png",
"MANISH":"logos/MANISH.png",
"SAMARTH":"logos/SAMARTH.png",

"AKSHATA":"logos/AKSHATA.png",
"SPOORTI":"logos/SPOORTI.png",
"SANIKA":"logos/SANIKA.png",

"PRAJWAL C":"logos/PRAJWAL_C.png",
"ADVAITH J":"logos/ADVAITH_J.png",
"PRACHEEN":"logos/PRACHEEN.png",

"SAMRUDDHI":"logos/SAMRUDDHI.png",
"SANVI":"logos/SANVI.png",

"PRABHAS":"logos/PRABHAS.png",
"PRITHVIRAJ":"logos/PRITHVIRAJ.png",
"ARNAV":"logos/ARNAV.png",

"SUPRITA":"logos/SUPRITA.png",
"AROHI":"logos/AROHI.png",

"PAVAN":"logos/PAVAN.png",
"SUDHANVA":"logos/SUDHANVA.png",
"SANGMESH":"logos/SANGMESH.png",

"PRIYA":"logos/PRIYA.png",
"ANANYA":"logos/ANANYA.png",
"SAHANA":"logos/SAHANA.png",

"ATHARVA":"logos/ATHARVA.png",
"RAJNEET":"logos/RAJNEET.png",
"SIDDARTH":"logos/SIDDARTH.png",

"PRAKRUTI":"logos/PRAKRUTI.png",
"AMRUTA":"logos/AMRUTA.png",
"HARSHITA":"logos/HARSHITA.png",

"TARUN":"logos/TARUN.png",
"SUPRIT":"logos/SUPRIT.png",
"SHARAN":"logos/SHARAN.png",

"SANCHI":"logos/SANCHI.png",
"AKSHARA":"logos/AKSHARA.png",
"NITYASHREE":"logos/NITYASHREE.png"

};

/* ==========================
   MINISTRIES
========================== */

const ministries = {

"Shala Vidyarthi Pramukh (Boys)" : [
"AMARNATH",
"AMBRISH"
],

"Shala Vidyarthi Pramukh (Girls)" : [
"SINCHANA",
"ANAGHA",
"ANVI"
],

"Shala Vidyarthi Upa Pramukh (Boys)" : [
"KARTHIK",
"MANISH",
"SAMARTH"
],

"Shala Vidyarthi Upa Pramukh (Girls)" : [
"AKSHATA",
"SPOORTI",
"SANIKA"
],

"Anushasanam Pramukh (Boys)" : [
"PRAJWAL C",
"ADVAITH J",
"PRACHEEN"
],

"Anushasanam Pramukh (Girls)" : [
"SAMRUDDHI",
"SANVI"
],

"Swachhata Pramukh (Boys)" : [
"PRABHAS",
"PRITHVIRAJ",
"ARNAV"
],

"Swachhata Pramukh (Girls)" : [
"SUPRITA",
"AROHI",
"AKSHATA"
],

"Samskritika Pramukh (Boys)" : [
"PAVAN",
"SUDHANVA",
"SANGMESH"
],

"Samskritika Pramukh (Girls)" : [
"PRIYA",
"ANANYA",
"SAHANA"
],

"Vahini Pramukh (Boys)" : [
"ATHARVA",
"RAJNEET",
"SIDDARTH"
],

"Vahini Pramukh (Girls)" : [
"PRAKRUTI",
"AMRUTA",
"HARSHITA"
],

"Vahini Upa Pramukh (Boys)" : [
"TARUN",
"SUPRIT",
"SHARAN"
],

"Vahini Upa Pramukh (Girls)" : [
"SANCHI",
"AKSHARA",
"NITYASHREE"
]

};

/* ==========================
   CREATE CARDS
========================== */

const container =
document.getElementById(
"ministriesContainer"
);

for(const ministry in ministries){

const ministryCard =
document.createElement("div");

ministryCard.className =
"ministry";

ministryCard.dataset.ministry =
ministry;

let html = `

<div class="ministry-title">

${ministry}

</div>

<div class="candidates">

`;

ministries[ministry]
.forEach(candidate=>{

html += `

<label class="candidate">

<img
src="${
candidateLogos[candidate] ||
'logos/default.png'
}"
class="candidate-logo"
alt="${candidate}">

<div class="candidate-name">

${candidate}

</div>

<div class="symbol-label">

Election Symbol

</div>

<input
type="radio"
name="${ministry}"
value="${candidate}">

</label>

`;

});

html += `

</div>

`;

ministryCard.innerHTML =
html;

container.appendChild(
ministryCard
);

}

/* ==========================
   CARD SELECTION EFFECT
========================== */

document
.addEventListener(
"change",
function(e){

if(
e.target.type === "radio"
){

document
.querySelectorAll(
`.candidate input[name="${e.target.name}"]`
)
.forEach(radio=>{

radio.closest(
".candidate"
)
.classList.remove(
"selected"
);

});

e.target
.closest(".candidate")
.classList.add(
"selected"
);

updateProgress();

}

}
);

/* ==========================
   PROGRESS BAR
========================== */

function updateProgress(){

let completed = 0;

for(const ministry in ministries){

if(
document.querySelector(
`input[name="${ministry}"]:checked`
)
){
completed++;
}

}

const total =
Object.keys(
ministries
).length;

const percent =
(completed / total) * 100;

document.getElementById(
"progressText"
).innerHTML =

`${completed} / ${total} Ministries Completed`;

document.getElementById(
"progressFill"
).style.width =

percent + "%";

}

/* ==========================
   VOTER INFO
========================== */

function getVoterInfo(){

const voterType =
sessionStorage.getItem(
"voterType"
);

let voterId = "";

if(voterType === "Student"){

const studentClass =
sessionStorage.getItem(
"studentClass"
);

const rollNumber =
sessionStorage.getItem(
"rollNumber"
);

voterId =
`${studentClass}_${rollNumber}`;

}

if(voterType === "Teacher"){

const teacherName =
sessionStorage.getItem(
"teacherName"
);

voterId =
`TEACHER_${teacherName}`;

}

return{
voterType,
voterId
};

}

/* ==========================
   SUBMIT VOTE
========================== */

document
.getElementById(
"votingForm"
)
.addEventListener(
"submit",
function(e){

e.preventDefault();

/* Validate */

for(const ministry in ministries){

const selected =
document.querySelector(
`input[name="${ministry}"]:checked`
);

if(!selected){

const card =
document.querySelector(
`[data-ministry="${ministry}"]`
);

card.scrollIntoView({

behavior:"smooth",
block:"center"

});

card.classList.add(
"missing"
);

setTimeout(()=>{

card.classList.remove(
"missing"
);

},2500);

alert(
`Please vote for ${ministry}`
);

return;

}

}

/* Confirmation */

const confirmVote =
confirm(
"Are you sure you want to submit your vote?\n\nYou cannot change it later."
);

if(!confirmVote){
return;
}

const voter =
getVoterInfo();

const votes = [];

for(const ministry in ministries){

const selected =
document.querySelector(
`input[name="${ministry}"]:checked`
);

votes.push({

ministry: ministry,
candidate: selected.value

});

}

const payload = {

voterType:
voter.voterType,

voterId:
voter.voterId,

votes:
votes,

device:
navigator.userAgent

};

/* Loader */

document.getElementById(
"loader"
).style.display = "flex";

/* Form Submit */

const form =
document.createElement(
"form"
);

form.method = "POST";

form.action =
WEBAPP_URL;

form.target =
"hiddenFrame";

const input =
document.createElement(
"input"
);

input.type =
"hidden";

input.name =
"data";

input.value =
JSON.stringify(payload);

form.appendChild(input);

document.body.appendChild(form);

form.submit();

/* Success */

setTimeout(()=>{

document.getElementById(
"loader"
).style.display = "none";

document.querySelector(
".submit-btn"
).disabled = true;

const success =
document.createElement(
"div"
);

success.className =
"success";

success.innerHTML =

"✅ Vote Submitted Successfully";

document.body.appendChild(
success
);

sessionStorage.clear();

setTimeout(()=>{

window.location.href =
"index.html";

},3000);

},2000);

});

</script>

</body>
</html>
