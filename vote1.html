<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RVK Election Voting Booth</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f4f7fc;
padding:20px;
}

.header{
text-align:center;
margin-bottom:30px;
}

.header img{
width:100px;
margin-bottom:10px;
}

.header h1{
color:#0d47a1;
font-size:32px;
margin-bottom:5px;
}

.header h2{
color:#2e7d32;
font-size:22px;
margin-bottom:10px;
}

.header p{
color:#555;
font-size:16px;
}

.ministry{
background:white;
padding:20px;
margin-bottom:25px;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.ministry-title{
background:#0d47a1;
color:white;
padding:12px;
border-radius:10px;
text-align:center;
font-size:20px;
font-weight:bold;
margin-bottom:20px;
}

.candidates{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:15px;
}

.candidate{
width:180px;
padding:15px;
border:2px solid #ddd;
border-radius:12px;
text-align:center;
cursor:pointer;
transition:.3s;
}

.candidate:hover{
background:#e8f5e9;
transform:translateY(-3px);
}

.candidate input{
margin-top:10px;
transform:scale(1.3);
}

.submit-btn{
width:100%;
padding:18px;
font-size:20px;
font-weight:bold;
background:#2e7d32;
color:white;
border:none;
border-radius:12px;
cursor:pointer;
position:sticky;
bottom:10px;
}

.submit-btn:hover{
background:#1b5e20;
}

.success{
text-align:center;
font-size:24px;
color:#2e7d32;
margin-top:20px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="header">

<img src="Picture1.jpg" alt="School Logo">

<h1>RASHTROTTHANA VIDYA KENDRA</h1>

<h2>KALABURAGI</h2>

<p>
Student Council Election 2026–27
</p>

</div>

<form id="votingForm">

<div id="ministriesContainer"></div>

<button type="submit" class="submit-btn">
SUBMIT VOTE
</button>

</form>

<script>

const WEBAPP_URL =
"https://script.google.com/macros/s/AKfycbw6oBIJ5M98pC5mIdwL9mszDwYCTvtdmgkifaCoDTrtE7Vg4y2wNlnJugzHHYptVND1/exec";

const ministries = {

"Shala Vidyarthi Pramukh (Boys)" : [
"AMARNATH",
"AMBRISH"
],

"Shala Vidyarthi Pramukh (Girls)" : [
"SINCHANA",
"ANAGHA",
"ANVI"
],

"Shala Vidyarthi Upa Pramukh (Boys)" : [
"KARTHIK",
"MANISH",
"SAMARTH"
],

"Shala Vidyarthi Upa Pramukh (Girls)" : [
"AKSHATA",
"SPOORTI",
"SANIKA"
],

"Anushasanam Pramukh (Boys)" : [
"PRAJWAL C",
"ADVAITH J",
"PRACHEEN"
],

"Anushasanam Pramukh (Girls)" : [
"SAMRUDDHI",
"SANVI"
],

"Swachhata Pramukh (Boys)" : [
"PRABHAS",
"PRITHVIRAJ",
"ARNAV"
],

"Swachhata Pramukh (Girls)" : [
"SUPRITA",
"AROHI",
"AKSHATA"
],

"Samskritika Pramukh (Boys)" : [
"PAVAN",
"SUDHANVA",
"SANGMESH"
],

"Samskritika Pramukh (Girls)" : [
"PRIYA",
"ANANYA",
"SAHANA"
],

"Vahini Pramukh (Boys)" : [
"ATHARVA",
"RAJNEET",
"SIDDARTH"
],

"Vahini Pramukh (Girls)" : [
"PRAKRUTI",
"AMRUTA",
"HARSHITA"
],

"Vahini Upa Pramukh (Boys)" : [
"TARUN",
"SUPRIT",
"SHARAN"
],

"Vahini Upa Pramukh (Girls)" : [
"SANCHI",
"AKSHARA",
"NITYASHREE"
]

};

const container =
document.getElementById(
"ministriesContainer"
);

for(const ministry in ministries){

const card =
document.createElement("div");

card.className =
"ministry";

let html = `
<div class="ministry-title">
${ministry}
</div>

<div class="candidates">
`;

ministries[ministry]
.forEach(candidate => {

html += `
<label class="candidate">

<div>
${candidate}
</div>

<input
type="radio"
name="${ministry}"
value="${candidate}">

</label>
`;

});

html += `
</div>
`;

card.innerHTML =
html;

container.appendChild(card);

}
  function getVoterInfo(){

const voterType =
sessionStorage.getItem("voterType");

let voterId = "";

if(voterType === "Student"){

const studentClass =
sessionStorage.getItem("studentClass");

const rollNumber =
sessionStorage.getItem("rollNumber");

voterId =
`${studentClass}_${rollNumber}`;

}

if(voterType === "Teacher"){

const teacherName =
sessionStorage.getItem("teacherName");

voterId =
`TEACHER_${teacherName}`;

}

return {
voterType,
voterId
};

}

document
.getElementById("votingForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

for(const ministry in ministries){

const selected =
document.querySelector(
`input[name="${ministry}"]:checked`
);

if(!selected){

alert(
`Please vote for ${ministry}`
);

return;

}

}

const voter =
getVoterInfo();

const votes = [];

for(const ministry in ministries){

const selected =
document.querySelector(
`input[name="${ministry}"]:checked`
);

votes.push({

ministry: ministry,

candidate:
selected.value

});

}

try{

const response =
await fetch(
WEBAPP_URL,
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

voterType:
voter.voterType,

voterId:
voter.voterId,

votes:votes,

device:
navigator.userAgent

})

}
);

const result =
await response.text();

if(
result ===
"ALREADY_VOTED"
){

alert(
"You have already voted."
);

window.location.href =
"WELCOME_PAGE.HTML";

return;

}

document
.querySelector(
".submit-btn"
)
.disabled = true;

const msg =
document.createElement(
"div"
);

msg.className =
"success";

msg.innerHTML =
"✅ Vote Submitted Successfully";

document.body
.appendChild(msg);

setTimeout(()=>{

window.location.href =
"WELCOME_PAGE.HTML";

},3000);

}
catch(error){

console.error(error);

alert(
"Unable to submit vote. Please try again."
);

}

});

</script>

</body>
</html>
