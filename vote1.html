<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RVK Election Voting Booth</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f4f7fc;
padding:20px;
}

.header{
text-align:center;
margin-bottom:30px;
}

.header img{
width:100px;
margin-bottom:10px;
}

.header h1{
background:linear-gradient(
90deg,
#0d47a1,
#1565c0,
#1e88e5
);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:shine 4s linear infinite;
}

@keyframes shine{
0%{background-position:0%;}
100%{background-position:200%;}
}

.header h2{
    font-family:'Montserrat',sans-serif;
    font-size:26px;
    font-weight:700;
}

.header p{
color:#555;
font-size:16px;
}

.ministry{
background:white;
padding:20px;
margin-bottom:25px;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,.1);
}
 .ministry{
backdrop-filter:blur(15px);
background:rgba(255,255,255,.85);
border:1px solid rgba(255,255,255,.5);
box-shadow:
0 10px 30px rgba(0,0,0,.08);
}

.ministry-title{
background:#0d47a1;
color:white;
padding:12px;
border-radius:10px;
text-align:center;
font-size:20px;
font-weight:bold;
margin-bottom:20px;
}

.candidates{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:15px;
}

.candidate{
    position:relative;
    overflow:hidden;
    transition:.35s ease;
}

.candidate:hover{
    transform:translateY(-8px);
    border-color:#1565c0;
    box-shadow:0 15px 35px rgba(21,101,192,.25);
    background:linear-gradient(
        135deg,
        #f5faff,
        #e3f2fd
    );
}

.candidate input{
margin-top:10px;
transform:scale(1.3);
}

.submit-btn{
width:100%;
padding:18px;
font-size:20px;
font-weight:bold;
background:#2e7d32;
color:white;
border:none;
border-radius:12px;
cursor:pointer;
position:sticky;
bottom:10px;
}

.submit-btn:hover{
background:#1b5e20;
}
 .candidate.selected{
    background:linear-gradient(
        135deg,
        #1565c0,
        #0d47a1
    );
    color:white;
    border:2px solid #64b5f6;
    transform:translateY(-5px);
    box-shadow:0 20px 40px rgba(13,71,161,.35);
}

.success{
text-align:center;
font-size:24px;
color:#2e7d32;
margin-top:20px;
font-weight:bold;
}
 body{
    font-family:'Inter',sans-serif;
}
 @keyframes shake{
0%,100%{transform:translateX(0);}
25%{transform:translateX(-8px);}
75%{transform:translateX(8px);}
}

.missing{
    border:3px solid #e53935;
    animation:shake .4s linear 3;
}
#progressBox{
position:sticky;
top:10px;
z-index:999;
background:white;
padding:15px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
margin-bottom:20px;
}

.progressBar{
height:12px;
background:#ddd;
border-radius:20px;
overflow:hidden;
}

#progressFill{
height:100%;
width:0%;
background:linear-gradient(
90deg,
#43a047,
#66bb6a
);
transition:.4s;
}
</style>

</head>

<body>
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<div id="progressBox">
    <div id="progressText">
        0 / 14 Ministries Completed
    </div>

    <div class="progressBar">
        <div id="progressFill"></div>
    </div>
</div>
<div class="header">

<img src="Picture1.jpg" alt="School Logo">

<h1>RASHTROTTHANA VIDYA KENDRA</h1>

<h2>KALABURAGI</h2>

<p>
Student Council Election 2026–27
</p>

</div>

<form id="votingForm">

<div id="ministriesContainer"></div>

<button type="submit" class="submit-btn">
SUBMIT VOTE
</button>

</form>

<script>

const WEBAPP_URL =
"https://script.google.com/macros/s/AKfycbyUP49bRuBO7Btfqq7UiiN3m9X4puuY5sULwsBwTMf0yzXS1WS-r8BPx-iFKh-IP4_4/exec";

const ministries = {

"Shala Vidyarthi Pramukh (Boys)" : [
"AMARNATH",
"AMBRISH"
],

"Shala Vidyarthi Pramukh (Girls)" : [
"SINCHANA",
"ANAGHA",
"ANVI"
],

"Shala Vidyarthi Upa Pramukh (Boys)" : [
"KARTHIK",
"MANISH",
"SAMARTH"
],

"Shala Vidyarthi Upa Pramukh (Girls)" : [
"AKSHATA",
"SPOORTI",
"SANIKA"
],

"Anushasanam Pramukh (Boys)" : [
"PRAJWAL C",
"ADVAITH J",
"PRACHEEN"
],

"Anushasanam Pramukh (Girls)" : [
"SAMRUDDHI",
"SANVI"
],

"Swachhata Pramukh (Boys)" : [
"PRABHAS",
"PRITHVIRAJ",
"ARNAV"
],

"Swachhata Pramukh (Girls)" : [
"SUPRITA",
"AROHI",
"AKSHATA"
],

"Samskritika Pramukh (Boys)" : [
"PAVAN",
"SUDHANVA",
"SANGMESH"
],

"Samskritika Pramukh (Girls)" : [
"PRIYA",
"ANANYA",
"SAHANA"
],

"Vahini Pramukh (Boys)" : [
"ATHARVA",
"RAJNEET",
"SIDDARTH"
],

"Vahini Pramukh (Girls)" : [
"PRAKRUTI",
"AMRUTA",
"HARSHITA"
],

"Vahini Upa Pramukh (Boys)" : [
"TARUN",
"SUPRIT",
"SHARAN"
],

"Vahini Upa Pramukh (Girls)" : [
"SANCHI",
"AKSHARA",
"NITYASHREE"
]

};

const container =
document.getElementById(
"ministriesContainer"
);

for(const ministry in ministries){

const card =
document.createElement("div");

card.className =
"ministry";

let html = `
<div class="ministry-title">
${ministry}
</div>

<div class="candidates">
`;

ministries[ministry]
.forEach(candidate => {

html += `
<label class="candidate">

<div>
${candidate}
</div>

<input
type="radio"
name="${ministry}"
value="${candidate}">

</label>
`;

});

html += `
</div>
`;
 
card.innerHTML =
html;

container.appendChild(card);

}
  function getVoterInfo(){

const voterType =
sessionStorage.getItem("voterType");

let voterId = "";

if(voterType === "Student"){

const studentClass =
sessionStorage.getItem("studentClass");

const rollNumber =
sessionStorage.getItem("rollNumber");

voterId =
`${studentClass}_${rollNumber}`;

}

if(voterType === "Teacher"){

const teacherName =
sessionStorage.getItem("teacherName");

voterId =
`TEACHER_${teacherName}`;

}

return {
voterType,
voterId
};

}

document
.getElementById("votingForm")
.addEventListener(
"submit",
function(e){

e.preventDefault();

for(const ministry in ministries){

const selected =
document.querySelector(
`input[name="${ministry}"]:checked`
);

if(!selected){

const ministryCard =
document.querySelector(
`[data-ministry="${ministry}"]`
);

ministryCard.scrollIntoView({
    behavior:'smooth',
    block:'center'
});

ministryCard.classList.add('missing');

setTimeout(()=>{
    ministryCard.classList.remove('missing');
},3000);

return;

}

}

const voter =
getVoterInfo();

const votes = [];

for(const ministry in ministries){

const selected =
document.querySelector(
`input[name="${ministry}"]:checked`
);

votes.push({

ministry: ministry,

candidate: selected.value

});

}

const payload = {

voterType: voter.voterType,

voterId: voter.voterId,

votes: votes,

device: navigator.userAgent

};

const form =
document.createElement("form");

form.method = "POST";

form.action = WEBAPP_URL;

form.target = "hiddenFrame";

const input =
document.createElement("input");

input.type = "hidden";

input.name = "data";

input.value =
JSON.stringify(payload);

form.appendChild(input);

document.body.appendChild(form);

form.submit();

document.querySelector(".submit-btn").disabled = true;

const msg =
document.createElement("div");

msg.className = "success";

msg.innerHTML =
"✅ Vote Submitted Successfully";

document.body.appendChild(msg);

sessionStorage.clear();

setTimeout(()=>{

window.location.href =
"index.html";

},2000);

});

</script>
<iframe
name="hiddenFrame"
style="display:none;">
</iframe>
</body>
</html>
