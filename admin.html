<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RVK Election Results Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f4f7fb;
padding:20px;
}

.header{
background:linear-gradient(135deg,#002b7f,#004aad);
color:white;
padding:20px;
border-radius:15px;
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:25px;
box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.logo{
width:80px;
height:80px;
object-fit:contain;
}

.title{
text-align:center;
flex:1;
}

.title h1{
font-size:32px;
margin-bottom:8px;
}

.title h2{
font-size:20px;
font-weight:400;
}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,.08);
text-align:center;
}

.card h3{
color:#666;
margin-bottom:10px;
}

.card .value{
font-size:36px;
font-weight:bold;
color:#0d47a1;
}

.controls{
display:flex;
gap:15px;
justify-content:center;
margin-bottom:25px;
flex-wrap:wrap;
}

.btn{
padding:12px 25px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
font-size:15px;
}

.print-btn{
background:#2e7d32;
color:white;
}

.export-btn{
background:#ff9800;
color:white;
}

.refresh-btn{
background:#1565c0;
color:white;
}

.ministry{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:25px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.ministry-title{
background:#0d47a1;
color:white;
padding:14px;
border-radius:10px;
text-align:center;
font-size:22px;
font-weight:bold;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
margin-bottom:20px;
}

th{
background:#e3f2fd;
padding:12px;
border:1px solid #ddd;
}

td{
padding:10px;
border:1px solid #ddd;
text-align:center;
}

.winner{
background:#fff3cd;
border:2px solid #ffc107;
padding:15px;
border-radius:10px;
font-size:20px;
font-weight:bold;
text-align:center;
margin-top:15px;
}

.chart-container{
max-width:900px;
margin:auto;
}

.footer{
text-align:center;
margin-top:30px;
color:#666;
}

@media(max-width:768px){

.header{
flex-direction:column;
gap:15px;
}

.title h1{
font-size:24px;
}

}

</style>
</head>

<body>

<div class="header">

<img src="Picture1.jpg" class="logo">

<div class="title">
<h1>RASHTROTTHANA VIDYA KENDRA</h1>
<h2>KALABURAGI</h2>
<h2>Student Council Election 2026-27</h2>
</div>

<img src="Picture1.jpg" class="logo">

</div>

<div class="summary">

<div class="card">
<h3>Total Votes</h3>
<div class="value" id="totalVotes">0</div>
</div>

<div class="card">
<h3>Student Votes</h3>
<div class="value" id="studentVotes">0</div>
</div>

<div class="card">
<h3>Teacher Votes</h3>
<div class="value" id="teacherVotes">0</div>
</div>

</div>

<div class="controls">

<button class="btn print-btn" onclick="window.print()">
🖨 Print Results
</button>

<button class="btn export-btn" onclick="downloadCSV()">
⬇ Download CSV
</button>

<button class="btn refresh-btn" onclick="loadResults()">
🔄 Refresh
</button>

</div>

<div id="resultsContainer"></div>

<div class="footer">
RVK Election Results Dashboard © 2026
</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyUP49bRuBO7Btfqq7UiiN3m9X4puuY5sULwsBwTMf0yzXS1WS-r8BPx-iFKh-IP4_4/exec";

let exportData = [];

async function loadResults(){

try{

const response =
await fetch(API_URL);

const data =
await response.json();

document.getElementById(
"totalVotes"
).textContent =
data.totalVotes || 0;

document.getElementById(
"studentVotes"
).textContent =
data.studentVotes || 0;

document.getElementById(
"teacherVotes"
).textContent =
data.teacherVotes || 0;

const container =
document.getElementById(
"resultsContainer"
);

container.innerHTML = "";

exportData = [];

for(const ministry in data.results){

const card =
document.createElement("div");

card.className =
"ministry";

let html = `
<div class="ministry-title">
${ministry}
</div>

<table>
<thead>
<tr>
<th>Candidate</th>
<th>Student</th>
<th>Teacher</th>
<th>Total</th>
</tr>
</thead>
<tbody>
`;

let labels = [];
let votes = [];

let winner = "";
let maxVotes = 0;

for(const candidate in data.results[ministry]){

const row =
data.results[ministry][candidate];

labels.push(candidate);
votes.push(row.total);

exportData.push([
ministry,
candidate,
row.student,
row.teacher,
row.total
]);

if(row.total > maxVotes){
maxVotes = row.total;
winner = candidate;
}

html += `
<tr>
<td>${candidate}</td>
<td>${row.student}</td>
<td>${row.teacher}</td>
<td>${row.total}</td>
</tr>
`;

}

html += `
</tbody>
</table>

<div class="winner">
🏆 Winner: ${winner}
( ${maxVotes} Votes )
</div>

<div class="chart-container">
<canvas id="chart_${btoa(ministry).replace(/=/g,'')}"></canvas>
</div>
`;

card.innerHTML = html;

container.appendChild(card);

setTimeout(()=>{

new Chart(
document.getElementById(
`chart_${btoa(ministry).replace(/=/g,'')}`
),
{
type:'bar',
data:{
labels:labels,
datasets:[{
label:'Votes',
data:votes
}]
},
options:{
responsive:true,
plugins:{
legend:{
display:false
}
}
}
}
);

},100);

}

}
catch(err){

console.error(err);

alert(
"Unable to load results."
);

}

}

function downloadCSV(){

let csv =
"Ministry,Candidate,Student Votes,Teacher Votes,Total Votes\n";

exportData.forEach(row=>{

csv += row.join(",") + "\n";

});

const blob =
new Blob(
[csv],
{type:"text/csv"}
);

const url =
URL.createObjectURL(blob);

const a =
document.createElement("a");

a.href = url;

a.download =
"RVK_Election_Results.csv";

a.click();

URL.revokeObjectURL(url);

}

loadResults();

setInterval(
loadResults,
30000
);

</script>

</body>
</html>
