<script>

const voterType =
document.getElementById("voterType");

const studentSection =
document.getElementById("studentSection");

const teacherSection =
document.getElementById("teacherSection");

voterType.addEventListener("change",()=>{

studentSection.classList.add("hidden");
teacherSection.classList.add("hidden");

if(voterType.value==="Student"){
studentSection.classList.remove("hidden");
}

if(voterType.value==="Teacher"){
teacherSection.classList.remove("hidden");
}

});

const rollDropdown =
document.getElementById("rollNumber");

for(let i=1;i<=45;i++){

const option =
document.createElement("option");

option.value=i;
option.textContent=i;

rollDropdown.appendChild(option);

}

function enterVotingBooth(){

const voter =
voterType.value;

if(!voter){

alert("Please select voter type");
return;

}

if(voter==="Student"){

const studentClass =
document.getElementById("studentClass").value;

const roll =
document.getElementById("rollNumber").value;

if(!studentClass || !roll){

alert("Please select class and roll number");
return;

}

sessionStorage.setItem(
"voterType",
"Student"
);

sessionStorage.setItem(
"studentClass",
studentClass
);

sessionStorage.setItem(
"rollNumber",
roll
);

}

if(voter==="Teacher"){

const teacher =
document.getElementById("teacherName").value;

if(!teacher){

alert("Please select teacher name");
return;

}

sessionStorage.setItem(
"voterType",
"Teacher"
);

sessionStorage.setItem(
"teacherName",
teacher
);

}

window.location.href =
"vote1.html";

}

</script>
